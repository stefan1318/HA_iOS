name: STEVORA native iOS simulator build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/stevora-ios
    paths:
      - 'STEVORA/iOSApp/**'
      - '.github/workflows/stevora-ios-build.yml'

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate STEVORA Xcode project
        run: xcodegen generate --spec STEVORA/iOSApp/project.yml --project STEVORA/iOSApp
      - name: Build unsigned iOS Simulator app
        run: |
          set -o pipefail
          xcodebuild -project STEVORA/iOSApp/StevoraCompanion.xcodeproj \
            -scheme StevoraCompanion \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/stevora-derived \
            CODE_SIGNING_ALLOWED=NO build
      - name: Upload simulator application
        uses: actions/upload-artifact@v4
        with:
          name: stevora-ios-simulator-app
          path: /tmp/stevora-derived/Build/Products/Debug-iphonesimulator/StevoraCompanion.app
          if-no-files-found: error

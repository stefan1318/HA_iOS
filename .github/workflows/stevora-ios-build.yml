name: STEVORA native iOS simulator build

# Run simulator verification on demand after core checks.
on:
  workflow_dispatch:

concurrency:
  group: stevora-ios-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose Xcode environment
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
      - name: Generate STEVORA icon
        run: |
          swift STEVORA/iOSApp/Branding/generate-icon.swift STEVORA/iOSApp/Assets.xcassets/AppIcon.appiconset/AppIcon.png
      - name: Generate STEVORA Xcode project
        run: |
          cd STEVORA/iOSApp
          xcodegen generate --spec project.yml
          test -f StevoraCompanion.xcodeproj/project.pbxproj
      - name: Build unsigned iOS Simulator app
        run: |
          set -o pipefail
          xcodebuild -project STEVORA/iOSApp/StevoraCompanion.xcodeproj \
            -scheme StevoraCompanion \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/stevora-derived \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/stevora-xcodebuild.log
      - name: Upload diagnostic build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stevora-ios-build-log
          path: /tmp/stevora-xcodebuild.log
          if-no-files-found: ignore
      - name: Upload simulator application
        uses: actions/upload-artifact@v4
        with:
          name: stevora-ios-simulator-app
          path: /tmp/stevora-derived/Build/Products/Debug-iphonesimulator/StevoraCompanion.app
          if-no-files-found: error

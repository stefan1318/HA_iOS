name: STEVORA iPhone IPA for AltStore

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stevora-altstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-unsigned-ipa:
    name: Build unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          fi
          xcodebuild -version
      - name: Build device application without Apple signing
        run: |
          set -o pipefail
          xcodebuild -project HomeAssistant.xcodeproj \
            -scheme App-Debug \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/stevora-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/stevora-build.log"
      - name: Package IPA for AltStore
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/stevora-build/Build/Products/Debug-iphoneos/HomeAssistant.app"
          if [ ! -d "$APP" ]; then
            find "$RUNNER_TEMP/stevora-build/Build/Products" -maxdepth 3 -name '*.app' -print
            echo "Expected device .app not found" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/HomeAssistant.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/STEVORA-iOS-AltStore-unsigned.ipa" Payload
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: STEVORA-iOS-AltStore-unsigned
          path: STEVORA-iOS-AltStore-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stevora-ios-altstore-build-log
          path: ${{ runner.temp }}/stevora-build.log
          if-no-files-found: ignore

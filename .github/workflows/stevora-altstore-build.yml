name: STEVORA iOS AltStore IPA Build

'on':
  push:
    paths:
      - '.github/workflows/stevora-altstore-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stevora-altstore-iphone
  cancel-in-progress: false

jobs:
  build:
    name: Unsigned iPhone IPA for AltStore
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout STEVORA iOS development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/stevora-ios
          persist-credentials: false
      - name: Verify STEVORA product identity
        run: |
          set -euo pipefail
          if ! grep -Eq \
            '^BUNDLE_ID_PREFIX[[:space:]]*=[[:space:]]*com[.]stevora' Configuration/HomeAssistant.xcconfig; then
            echo "::error::Upstream iOS bundle identifier detected. No STEVORA IPA may be published."
            exit 1
          fi
          if ! git grep -iq stevor -- Sources Configuration; then
            echo "::error::No STEVORA source branding detected."
            exit 1
          fi
      - name: Select Xcode 27
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer
          xcodebuild -version
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild -project HomeAssistant.xcodeproj \
            -scheme App-Debug \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/stevora-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/stevora-build.log"
      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/stevora-build/Build/Products/Debug-iphoneos/HomeAssistant.app"
          if [ ! -d "$APP" ]; then
            find "$RUNNER_TEMP/stevora-build/Build/Products" -name '*.app' -print
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/HomeAssistant.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/STEVORA-iOS-AltStore-unsigned.ipa" Payload
      - name: Verify packaged product identity
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ipa/Payload/HomeAssistant.app"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          case "$BUNDLE_ID" in
            com.stevora.*) ;;
            *) echo "::error::Non-STEVORA bundle ID: $BUNDLE_ID"; exit 1 ;;
          esac
          /usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$APP/Info.plist" | grep -iq stevor || {
            echo "::error::Non-STEVORA display name"; exit 1;
          }
      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: STEVORA-iOS-AltStore-unsigned
          path: STEVORA-iOS-AltStore-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: STEVORA-iOS-AltStore-build-log
          path: ${{ runner.temp }}/stevora-build.log
          if-no-files-found: ignore

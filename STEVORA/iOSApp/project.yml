name: StevoraCompanion
options:
  bundleIdPrefix: com.stevora
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: "16.4"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  StevoraCompanion:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: Assets.xcassets
      - path: Branding/LaunchScreen.storyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stevora.companion.ios
        INFOPLIST_KEY_CFBundleDisplayName: STEVORA
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "STEVORA uses your microphone for voice commands."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "STEVORA converts spoken commands to text."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "2.5.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
    info:
      path: Generated/StevoraInfo.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: NO
          NSAllowsLocalNetworking: YES
        NSLocationWhenInUseUsageDescription: "Share this device’s location with the STEVORA home you select."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Update presence in your selected home when the app is in the background."
        NSLocalNetworkUsageDescription: "Connect to your STEVORA OS home on the local network."
        UIBackgroundModes:
          - location
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.stevora
    dependencies: []
schemes:
  StevoraCompanion:
    build:
      targets:
        StevoraCompanion: all
